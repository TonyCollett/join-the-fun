<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>How Do I Feel?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffe8f3;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .corner {
      position: fixed;
      top: 12px;
      z-index: 3;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(58, 46, 92, 0.12);
      color: #3a2e5c;
      font-size: 24px;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
    }
    .corner:hover { background: rgba(58, 46, 92, 0.22); }
    #home { left: 12px; }
    #sound { right: 12px; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      text-align: center;
      color: #3a2e5c;
      font-family: Fredoka, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }
    .overlay h1 { margin: 0; font-size: clamp(3rem, 12vw, 8rem); color: #ff8fd8; text-shadow: 0 6px 0 #fff; }
    .overlay p { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); animation: pulse 1.2s ease-in-out infinite; }
    .overlay .score { animation: none; }
    .overlay .again { visibility: hidden; }
    .overlay.hidden { display: none; }
    #done { background: rgba(255, 255, 255, 0.6); }
    @keyframes pulse { 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <canvas id="faces"></canvas>

  <a id="home" class="corner" href="../../index.html" tabindex="-1" title="Back to games">🏠</a>
  <button id="sound" class="corner" tabindex="-1" title="Sound on/off">🔊</button>

  <div id="start" class="overlay">
    <h1>How Do I Feel?</h1>
    <p>Press any key to play! 😊</p>
  </div>

  <div id="done" class="overlay hidden">
    <h1>All done! 🎉</h1>
    <p class="score" id="score"></p>
    <p class="again" id="again">Press any key to play again!</p>
  </div>

  <script src="../../shared/round-timer.js"></script>
  <script>
    const FONT = "Fredoka, 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif";
    const COLORS = ["#ff5d73", "#ffb627", "#2ec4b6", "#5b8def", "#b15ef0", "#7ae582", "#ff8fd8"];
    const INK = "#3a2e5c";
    // How the face looks for each feeling. The big face eases smoothly between them.
    //   eye: how open the eyes are (0 shut, 1 wide)   eyeSize: how big the eyes are
    //   brow: eyebrow tilt (+ cross, - worried)        lift: how high the eyebrows sit
    //   curve: smile (+) or frown (-)                  open: how open the mouth is
    //   width: how wide the mouth is                   tint: face colour (r, g, b)
    //   blush, tear, zzz, tongue, steam, cross: extras that fade in (0-1)
    const FACE_DEFAULTS = {
      eye: 0.9, eyeSize: 1, brow: 0, lift: 0, curve: 0, open: 0, width: 0.7,
      blush: 0, tear: 0, zzz: 0, tongue: 0, steam: 0, cross: 0,
    };
    const FEELINGS = [
      { name: "happy", tint: [255, 209, 102], face: { curve: 1, open: 0.45, width: 1, lift: 0.3, blush: 1 } },
      { name: "sad", tint: [150, 196, 255], face: { eyeSize: 1.05, brow: -0.45, lift: 0.2, curve: -0.9, open: 0.06, width: 0.65, tear: 1 } },
      { name: "sleepy", tint: [196, 182, 245], face: { eye: 0.1, brow: -0.1, lift: -0.2, curve: 0.1, width: 0.4, zzz: 1 } },
      { name: "surprised", tint: [255, 232, 150], face: { eye: 1, eyeSize: 1.35, lift: 1.2, open: 1, width: 0.42 } },
      { name: "grumpy", tint: [255, 138, 112], face: { eye: 0.75, eyeSize: 0.95, brow: 0.5, lift: -0.4, curve: -0.6, width: 0.6, steam: 1 } },
      { name: "silly", tint: [255, 160, 220], face: { eye: 1, eyeSize: 1.1, brow: -0.2, lift: 0.6, curve: 0.8, open: 0.3, width: 0.85, tongue: 1, cross: 1, blush: 0.6 } },
    ].map((f) => ({ ...f, face: { ...FACE_DEFAULTS, ...f.face } }));
    const CHOICES = 3;         // face buttons to pick from
    const EASE = 7;            // how quickly the big face changes expression (per second)
    const YAY_TIME = 2.8;      // seconds of celebrating before the next feeling
    const ASK_DELAY = 2.2;     // pause after key-mashing stops before asking the question
    const REMIND_TIME = 9;     // seconds without an answer before asking again
    const MASH_GAP = 0.3;      // fastest a mashed key can change the face (seconds)

    const canvas = document.getElementById("faces");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("start");
    const soundBtn = document.getElementById("sound");
    const doneScreen = document.getElementById("done");
    const scoreText = document.getElementById("score");
    const againText = document.getElementById("again");
    const ROUND_SECONDS = 120;
    const timer = new RoundTimer(ROUND_SECONDS);

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOutBack = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    let W = 0, H = 0, bg = null, landscape = true;
    let L = {}; // layout: big face centre and size, button size and spots
    let bubbles = [], particles = [];
    let target = 0;        // index of the feeling the big face is showing
    let cur = { ...FEELINGS[0].face, tint: [...FEELINGS[0].tint] }; // the big face's expression right now
    let feelT = 0;         // seconds since the big face changed feeling
    let cards = [];        // the face buttons: { f, t, poke, wiggle, fade, win }
    let state = "ask";     // ask -> yay (picked the right one) -> ask ...
    let stateT = 0, askAt = 0, remindAt = 0, lastMash = -1, lastWrongSay = -9;
    let yayT = -1, blinkAt = 2, blinkT = 1;
    let phase = "title";   // title -> playing -> finale (time's up) -> done
    let time = 0, score = 0, restartAt = 0, finaleT = 0;
    let soundOn = true;
    try { soundOn = localStorage.getItem("howDoIFeelSound") !== "off"; } catch {}

    // ---------- Layout ----------

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#ffe8f3");
      bg.addColorStop(1, "#fff7e6");

      // Wide screens: big face on the left, buttons in a column on the right.
      // Tall screens: big face on top, buttons in a row along the bottom.
      const R = Math.max(30, Math.min(55, Math.min(W, H) * 0.065)); // the round timer's radius
      const topClear = 14 + 2 * R + 10;
      landscape = W >= H * 1.1;
      let b, spots, r, cx, cy;
      if (landscape) {
        b = Math.min(H * 0.27, W * 0.19);
        const gap = b * 0.17;
        spots = [0, 1, 2].map((i) => ({ x: W * 0.78, y: H / 2 + (i - 1) * (b + gap) }));
        cx = W * 0.34;
        cy = H * 0.5;
        r = Math.min(H * 0.34, W * 0.2);
        // Shrink the face until it (and its sleepy z's) stays clear of the clock.
        while (r > 40 && Math.hypot(cx + r * 0.6 - W / 2, cy - r * 1.2 - (14 + R)) < r * 0.45 + R + 10) r *= 0.95;
      } else {
        b = Math.min(W * 0.27, H * 0.19);
        const cardY = H - b / 2 - Math.max(16, H * 0.04);
        spots = [0, 1, 2].map((i) => ({ x: W / 2 + (i - 1) * b * 1.15, y: cardY }));
        const room = cardY - b / 2 - topClear - 16;
        r = Math.min(W * 0.36, room / 2.7);
        cx = W / 2;
        cy = topClear + r * 1.3 + (room - r * 2.7) / 2;
      }
      L = { b, spots, r, cx, cy };

      bubbles = Array.from({ length: Math.max(6, Math.round((W * H) / 60000)) }, () => ({
        x: rand(0, W), y: rand(0, H), r: rand(10, 40), speed: rand(8, 22), color: pick(COLORS), wob: rand(0, 6),
      }));
    }

    // ---------- Sound ----------

    let actx = null, master = null, noise = null;

    function audio() {
      if (!soundOn) return null;
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.5;
        master.connect(actx.destination);
        noise = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }

    function tone(freq, start, dur, vol, type = "sine", endFreq = freq) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + start;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    // A breathy whoosh of filtered noise, sweeping from one pitch to another.
    function breath(start, dur, vol, from, to) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + start;
      const src = a.createBufferSource();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      src.buffer = noise;
      filter.type = "bandpass";
      filter.Q.value = 2;
      filter.frequency.setValueAtTime(from, t);
      filter.frequency.exponentialRampToValueAtTime(to, t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filter).connect(gain).connect(master);
      src.start(t, rand(0, 1));
      src.stop(t + dur + 0.02);
    }

    // A low, buzzy "hmph" through a soft filter.
    function hmph(start, dur, freq) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + start;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.75, t + dur);
      filter.type = "lowpass";
      filter.frequency.value = 600;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(filter).connect(gain).connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    // A little sound for each feeling.
    const FEELING_SOUNDS = {
      happy() { // tee-hee-hee giggle
        for (let i = 0; i < 5; i++) tone(820 - i * 50, i * 0.11, 0.09, 0.13, "triangle", 1150 - i * 60);
      },
      sad() { // wah-wahhh
        tone(494, 0, 0.45, 0.14, "triangle", 440);
        tone(415, 0.45, 0.9, 0.14, "triangle", 311);
      },
      sleepy() { // a big yawn sliding up and down
        tone(220, 0, 0.6, 0.14, "sine", 440);
        tone(440, 0.55, 1.0, 0.12, "sine", 170);
        breath(0, 1.4, 0.1, 500, 300);
      },
      surprised() { // quick gasp and a whistle up
        breath(0, 0.25, 0.25, 900, 2500);
        tone(400, 0.05, 0.3, 0.13, "sine", 1300);
      },
      grumpy() { // hmph! hmph!
        hmph(0, 0.2, 170);
        hmph(0.3, 0.32, 150);
      },
      silly() { // boing-oing-oing
        tone(160, 0, 0.14, 0.18, "sine", 700);
        tone(700, 0.14, 0.12, 0.15, "sine", 240);
        tone(240, 0.26, 0.35, 0.15, "sine", 1000);
      },
    };

    let lastBoop = 0;
    function boop() {
      if (time - lastBoop < 0.08) return;
      lastBoop = time;
      tone(260, 0, 0.15, 0.15, "sine", 180);
    }

    function cheer() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.08, 0.3, 0.15, "triangle"));
    }

    function tick() {
      tone(1200, 0, 0.06, 0.1, "sine", 900);
    }

    function fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.12, i === 3 ? 0.8 : 0.3, 0.2, "triangle"));
    }

    function say(text) {
      if (!soundOn || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.8;
      u.pitch = 1.3;
      speechSynthesis.speak(u);
    }

    function setSound(on) {
      soundOn = on;
      soundBtn.textContent = on ? "🔊" : "🔇";
      try { localStorage.setItem("howDoIFeelSound", on ? "on" : "off"); } catch {}
      if (!on && "speechSynthesis" in window) speechSynthesis.cancel();
    }

    // ---------- Game ----------

    // The big face changes to a feeling and a fresh set of buttons pops up with it among them.
    // "full" says the whole thing; "mash" just names the feeling and asks once the keys go quiet.
    function showFeeling(i, mode) {
      target = i;
      feelT = 0;
      state = "ask";
      stateT = 0;
      yayT = -1;
      const others = shuffle(FEELINGS.map((_, j) => j).filter((j) => j !== i)).slice(0, CHOICES - 1);
      cards = shuffle([i, ...others]).map((f) => ({ f, t: 0, poke: 0, wiggle: 0, fade: 0, win: 0 }));
      FEELING_SOUNDS[FEELINGS[i].name]();
      const name = FEELINGS[i].name;
      if (mode === "full") {
        say(`I feel ${name}! Can you find ${name}?`);
        askAt = 0;
      } else {
        say(`${name}!`);
        askAt = time + ASK_DELAY;
      }
      remindAt = time + REMIND_TIME + (askAt ? ASK_DELAY : 0);
    }

    function nextFeeling() {
      let i;
      do { i = (Math.random() * FEELINGS.length) | 0; } while (i === target);
      showFeeling(i, "full");
    }

    // Any key that isn't 1, 2 or 3: the big face just tries on the next feeling.
    function mash() {
      if (time - lastMash < MASH_GAP) return;
      lastMash = time;
      showFeeling((target + 1) % FEELINGS.length, "mash");
    }

    function choose(slot) {
      if (state !== "ask") return;
      const card = cards[slot];
      if (!card || card.fade > 0) return;
      const name = FEELINGS[target].name;
      if (card.f === target) {
        state = "yay";
        stateT = 0;
        yayT = 0;
        askAt = 0;
        card.win = 0.001;
        for (const c of cards) if (c !== card) c.fade = 0.001;
        if (phase === "playing") score++;
        cheer();
        say(`Yes! That's ${name}!`);
        const s = L.spots[slot];
        sparkle(s.x, s.y, L.b * 0.5);
        sparkle(L.cx, L.cy, L.r * 0.6);
      } else {
        // Never a fail: a soft boop, and the right one wiggles to help.
        card.poke = 0.4;
        boop();
        for (const c of cards) if (c.f === target) c.wiggle = 1.6;
        if (time - lastWrongSay > 1.5) {
          lastWrongSay = time;
          askAt = 0;
          say(`That's ${FEELINGS[card.f].name}! Can you find ${name}?`);
        }
        remindAt = time + REMIND_TIME;
      }
    }

    function sparkle(x, y, size) {
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        const s = size * rand(2, 3.5);
        particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: rand(0.5, 0.8), age: 0, size: rand(4, 8), color: pick(COLORS),
        });
      }
    }

    function finishRound(message) {
      phase = "done";
      scoreText.textContent = message;
      againText.style.visibility = "hidden";
      doneScreen.classList.remove("hidden");
      restartAt = time + 2; // stop key-mashing from skipping straight past the end screen
      fanfare();
      say("All done!");
    }

    function update(dt) {
      timer.update(dt);
      feelT += dt;
      stateT += dt;

      // Ease the big face towards the feeling it's showing.
      const goal = FEELINGS[target];
      const k = Math.min(1, dt * EASE);
      for (const key in goal.face) cur[key] += (goal.face[key] - cur[key]) * k;
      for (let i = 0; i < 3; i++) cur.tint[i] += (goal.tint[i] - cur.tint[i]) * k;

      // Blink every few seconds.
      blinkT += dt;
      if (time > blinkAt) { blinkT = 0; blinkAt = time + rand(2.5, 5); }

      if (yayT >= 0) yayT += dt;
      for (const c of cards) {
        c.t += dt;
        c.poke = Math.max(0, c.poke - dt);
        c.wiggle = Math.max(0, c.wiggle - dt);
        if (c.fade > 0) c.fade = Math.min(1, c.fade + dt * 3);
        if (c.win > 0) c.win += dt;
      }

      if (phase === "playing") {
        if (state === "ask" && askAt && time >= askAt) {
          askAt = 0;
          say(`Can you find ${goal.name}?`);
          remindAt = time + REMIND_TIME;
        }
        if (state === "ask" && time >= remindAt) {
          remindAt = time + REMIND_TIME;
          say(`Can you find ${goal.name}?`);
          for (const c of cards) if (c.f === target) c.wiggle = 1.6;
        }
        if (state === "yay" && stateT >= YAY_TIME) nextFeeling();
      }

      if (phase === "finale") {
        finaleT += dt;
        if (finaleT > 3.2) finishRound(`You found ${score} feeling${score === 1 ? "" : "s"}!`);
      }
      if (phase === "done" && time >= restartAt) againText.style.visibility = "visible";

      for (const b of bubbles) {
        b.y -= b.speed * dt;
        if (b.y + b.r < 0) { b.y = H + b.r; b.x = rand(0, W); }
      }

      for (const p of particles) {
        p.age += dt;
        p.vx *= Math.max(0, 1 - 4 * dt);
        p.vy = p.vy * Math.max(0, 1 - 4 * dt) + 200 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      particles = particles.filter((p) => p.age < p.life);
    }

    // ---------- Drawing ----------

    const rgb = (c) => `rgb(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0})`;

    // A round face of radius r centred on the origin. p is an expression (see FACE_DEFAULTS),
    // t is a clock for the moving extras, blink squeezes the eyes shut (0-1).
    function drawFace(c, r, p, t, blink = 0) {
      const tint = rgb(p.tint);
      const A = c.globalAlpha; // a fading button fades its face too
      c.lineCap = "round";
      c.lineJoin = "round";

      // Steam puffs behind the head when grumpy.
      if (p.steam > 0.02) {
        for (const side of [-1, 1]) {
          for (let k = 0; k < 2; k++) {
            const u = (t * 0.8 + k * 0.5 + (side > 0 ? 0.25 : 0)) % 1;
            c.globalAlpha = A * p.steam * (1 - u) * 0.8;
            c.fillStyle = "#b4b0c4";
            c.beginPath();
            c.arc(side * (0.72 + 0.2 * u) * r, -(0.72 + 0.45 * u) * r, r * (0.07 + 0.09 * u), 0, Math.PI * 2);
            c.fill();
          }
        }
        c.globalAlpha = A;
      }

      // Head and a little curl of hair.
      c.fillStyle = tint;
      c.strokeStyle = INK;
      c.lineWidth = r * 0.045;
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.fill();
      c.stroke();
      c.lineWidth = r * 0.05;
      c.beginPath();
      c.moveTo(-0.04 * r, -0.98 * r);
      c.quadraticCurveTo(-0.08 * r, -1.25 * r, 0.12 * r, -1.22 * r);
      c.quadraticCurveTo(0.26 * r, -1.14 * r, 0.12 * r, -1.06 * r);
      c.stroke();

      // Rosy cheeks.
      if (p.blush > 0.02) {
        c.fillStyle = `rgba(255, 95, 140, ${0.45 * p.blush})`;
        for (const side of [-1, 1]) {
          c.beginPath();
          c.ellipse(side * 0.6 * r, 0.2 * r, 0.14 * r, 0.09 * r, 0, 0, Math.PI * 2);
          c.fill();
        }
      }

      // Eyes, with pupils that go cross-eyed when silly.
      const open = p.eye * (1 - blink);
      for (const side of [-1, 1]) {
        const ex = side * 0.36 * r, ey = -0.1 * r;
        const rx = 0.15 * r * p.eyeSize, ry = 0.19 * r * p.eyeSize;
        if (open < 0.2) {
          // Shut: a relaxed curve.
          c.strokeStyle = INK;
          c.lineWidth = r * 0.05;
          c.beginPath();
          c.arc(ex, ey, rx * 0.9, Math.PI * 0.15, Math.PI * 0.85);
          c.stroke();
        } else {
          const oy = ey + ry * (1 - open) * 0.4;
          const ory = ry * open;
          c.save();
          c.beginPath();
          c.ellipse(ex, oy, rx, ory, 0, 0, Math.PI * 2);
          c.fillStyle = "#fff";
          c.fill();
          c.clip();
          const pr = Math.min(rx, ry) * 0.58;
          const px = ex - side * p.cross * rx * 0.4;
          const py = oy + ory * 0.12;
          c.fillStyle = INK;
          c.beginPath();
          c.arc(px, py, pr, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = "#fff";
          c.beginPath();
          c.arc(px - pr * 0.35, py - pr * 0.4, pr * 0.35, 0, Math.PI * 2);
          c.fill();
          c.restore();
          c.strokeStyle = INK;
          c.lineWidth = r * 0.035;
          c.beginPath();
          c.ellipse(ex, oy, rx, ory, 0, 0, Math.PI * 2);
          c.stroke();
        }

        // Eyebrow: the inner end dips when cross and rises when worried.
        const by = ey - 0.32 * r * p.eyeSize - p.lift * 0.1 * r;
        c.save();
        c.translate(ex, by);
        c.rotate(side < 0 ? p.brow : -p.brow);
        c.strokeStyle = INK;
        c.lineWidth = r * 0.065;
        c.beginPath();
        c.moveTo(-0.14 * r, 0);
        c.lineTo(0.14 * r, 0);
        c.stroke();
        c.restore();
      }

      // A tear rolling down when sad.
      if (p.tear > 0.02) {
        const u = (t % 1.6) / 1.6;
        const tx = -0.36 * r - 0.06 * r, ty = 0.05 * r + u * 0.55 * r, ts = 0.08 * r;
        c.globalAlpha = A * p.tear * (1 - u * 0.8);
        c.fillStyle = "#4fa8ff";
        c.beginPath();
        c.moveTo(tx, ty - ts * 2);
        c.quadraticCurveTo(tx + ts * 1.1, ty - ts * 0.3, tx, ty + ts);
        c.quadraticCurveTo(tx - ts * 1.1, ty - ts * 0.3, tx, ty - ts * 2);
        c.fill();
        c.globalAlpha = A;
      }

      // Mouth: a smile or frown that opens up into a grin, an "O" or a yawn.
      const h = 0.42 * r;
      const w = 0.75 * r * p.width;
      const my = 0.42 * r;
      const cornerY = my - p.curve * 0.25 * h;
      const top = my + p.curve * 0.2 * h - p.open * 0.45 * h;
      const bot = my + p.curve * 0.2 * h + Math.max(0, p.curve) * 0.55 * h + p.open * 0.6 * h;
      const cx = (w / 2) * (0.55 + 0.4 * Math.min(1, p.open));
      const ctl = (y) => cornerY + (y - cornerY) / 0.75; // so the curve actually reaches y
      c.beginPath();
      c.moveTo(-w / 2, cornerY);
      c.bezierCurveTo(-cx, ctl(top), cx, ctl(top), w / 2, cornerY);
      c.bezierCurveTo(cx, ctl(bot), -cx, ctl(bot), -w / 2, cornerY);
      c.closePath();
      c.fillStyle = "#7a2e3e";
      c.fill();
      if (bot - top > 0.15 * h) {
        c.save();
        c.clip();
        c.fillStyle = "#ff8fa3";
        c.beginPath();
        c.ellipse(0, bot, w * 0.32, (bot - top) * 0.45, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
      // Tongue poking out when silly.
      if (p.tongue > 0.02) {
        const ty = Math.max(top, bot - 0.1 * r);
        const wig = Math.sin(t * 6) * 0.03 * r;
        c.fillStyle = "#ff6f91";
        c.strokeStyle = INK;
        c.lineWidth = r * 0.03;
        c.beginPath();
        c.ellipse(0.08 * r + wig, ty + 0.1 * r * p.tongue, 0.13 * r, 0.16 * r * p.tongue, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();
        c.beginPath();
        c.moveTo(0.08 * r + wig, ty);
        c.lineTo(0.08 * r + wig, ty + 0.14 * r * p.tongue);
        c.stroke();
      }
      c.strokeStyle = INK;
      c.lineWidth = r * 0.05;
      c.beginPath();
      c.moveTo(-w / 2, cornerY);
      c.bezierCurveTo(-cx, ctl(top), cx, ctl(top), w / 2, cornerY);
      c.bezierCurveTo(cx, ctl(bot), -cx, ctl(bot), -w / 2, cornerY);
      c.closePath();
      c.stroke();

      // Floating z's when sleepy.
      if (p.zzz > 0.02) {
        c.font = `600 ${r * 0.2}px ${FONT}`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        for (let k = 0; k < 3; k++) {
          const u = (t * 0.45 + k / 3) % 1;
          c.globalAlpha = A * p.zzz * Math.sin(u * Math.PI);
          c.fillStyle = "#5b8def";
          c.save();
          c.translate((0.62 + u * 0.35) * r, -(0.7 + u * 0.55) * r);
          c.scale(0.7 + u * 0.6, 0.7 + u * 0.6);
          c.fillText("z", 0, 0);
          c.restore();
        }
        c.globalAlpha = A;
      }
    }

    // How the big face moves for each feeling, on top of its expression.
    function bigFaceMotion() {
      const r = L.r, t = feelT, name = FEELINGS[target].name;
      const m = { dx: 0, dy: 0, rot: 0, sc: 1, p: { ...cur, tint: cur.tint } };
      if (name === "happy") m.dy = -Math.abs(Math.sin(t * 5)) * 0.05 * r;
      if (name === "sad") { m.dy = 0.04 * r; m.rot = Math.sin(t * 1.2) * 0.04; }
      if (name === "sleepy") {
        m.rot = Math.sin(t * 0.9) * 0.1; // nodding off
        const yawn = Math.max(0, Math.sin(t * 1.1 - 1)) ** 3;
        m.p.open = cur.open + yawn * 0.85;
        m.p.width = cur.width + yawn * 0.15;
      }
      if (name === "surprised") m.sc = 1 + 0.12 * Math.max(0, 1 - t * 3) * Math.sin(t * 25) + 0.015 * Math.sin(t * 8);
      if (name === "grumpy" && t % 1.6 < 0.45) m.dx = Math.sin(t * 40) * 0.025 * r;
      if (name === "silly") m.rot = Math.sin(t * 4) * 0.13;
      // Picked the right one: jump and spin.
      if (yayT >= 0) {
        const u = Math.min(1, yayT / 0.8);
        m.dy -= Math.sin(Math.PI * u) * 0.3 * r;
        m.rot += Math.PI * 2 * (u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2);
      }
      return m;
    }

    function drawBackground() {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      for (const b of bubbles) {
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x + Math.sin(time * 0.8 + b.wob) * 12, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawBigFace() {
      const { r, cx, cy } = L;
      const m = bigFaceMotion();
      // Soft shadow underneath.
      ctx.fillStyle = "rgba(58, 46, 92, 0.12)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + r * 1.12, r * 0.6 * (1 + m.dy / r), r * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      const blink = FEELINGS[target].name === "sleepy" ? 0 : Math.max(0, 1 - Math.abs(blinkT - 0.08) / 0.08);
      ctx.save();
      ctx.translate(cx + m.dx, cy + m.dy);
      ctx.rotate(m.rot);
      ctx.scale(m.sc, m.sc);
      drawFace(ctx, r, m.p, feelT, blink);
      ctx.restore();

      // The feeling's name, underneath.
      const size = r * 0.26;
      const pop = easeOutBack(Math.min(1, feelT / 0.4));
      if (pop <= 0) return;
      ctx.save();
      ctx.translate(cx, cy + r * 1.08 + size * 0.5);
      ctx.scale(pop, pop);
      ctx.font = `600 ${size}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 0.25;
      ctx.strokeStyle = "#fff";
      const word = FEELINGS[target].name;
      const label = word[0].toUpperCase() + word.slice(1);
      ctx.strokeText(label, 0, 0);
      ctx.fillStyle = INK;
      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // A face button: a white card with a little face and its number in the corner.
    function drawCard(c, i) {
      const s = L.spots[i], b = L.b;
      const pop = easeOutBack(clamp((c.t - i * 0.1) / 0.35, 0, 1));
      if (pop <= 0) return;
      let angle = 0, scale = pop, dy = 0;
      if (c.poke > 0) angle = Math.sin(c.poke * 50) * 0.08 * (c.poke / 0.4);
      if (c.wiggle > 0) {
        angle += Math.sin(c.wiggle * 30) * 0.1 * Math.min(1, c.wiggle);
        scale *= 1 + 0.08 * Math.abs(Math.sin(c.wiggle * 8));
      }
      if (c.win > 0) {
        scale *= 1 + 0.18 * Math.sin(Math.min(1, c.win / 0.5) * Math.PI / 2);
        dy = -Math.abs(Math.sin(c.win * 6)) * b * 0.06;
      }
      ctx.save();
      ctx.globalAlpha = 1 - c.fade * 0.75;
      ctx.translate(s.x, s.y + dy);
      ctx.rotate(angle);
      ctx.scale(scale * (1 - c.fade * 0.15), scale * (1 - c.fade * 0.15));

      ctx.shadowColor = "rgba(58, 46, 92, 0.22)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 5;
      ctx.fillStyle = "#fff";
      roundRect(-b / 2, -b / 2, b, b, b * 0.2);
      ctx.fill();
      ctx.shadowColor = "transparent";
      if (c.wiggle > 0 || c.win > 0) {
        ctx.strokeStyle = "#ffb627";
        ctx.lineWidth = b * 0.05;
        ctx.stroke();
      }

      const f = FEELINGS[c.f];
      ctx.save();
      ctx.translate(b * 0.04, b * 0.06);
      drawFace(ctx, b * 0.3, { ...f.face, tint: f.tint }, time + i);
      ctx.restore();

      // Number badge in the top-left corner.
      const br = b * 0.15;
      const bx = -b / 2 + br * 0.75, by = -b / 2 + br * 0.75;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = c.wiggle > 0 ? "#ffb627" : INK;
      ctx.lineWidth = br * 0.16;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.font = `600 ${br * 1.4}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = INK;
      ctx.fillText(i + 1, bx, by + br * 0.08);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      if (phase !== "title") cards.forEach(drawCard);
      drawBigFace();

      for (const p of particles) {
        ctx.globalAlpha = 1 - p.age / p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (phase !== "title") timer.draw(ctx, W, H);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---------- Input ----------

    function start() {
      if (phase === "playing" || phase === "finale") return;
      if (phase === "done" && time < restartAt) return;
      phase = "playing";
      score = 0;
      startScreen.classList.add("hidden");
      doneScreen.classList.add("hidden");
      audio();
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
      lastMash = -1;
      lastWrongSay = -9;
      nextFeeling();
      timer.start();
    }

    function cardAt(x, y) {
      return L.spots.findIndex((s) => Math.abs(x - s.x) < L.b * 0.55 && Math.abs(y - s.y) < L.b * 0.55);
    }

    // 1, 2 and 3 pick a face button; any other key just changes the big face.
    addEventListener("keydown", (e) => {
      // Leave F1–F12 alone so grown-ups can still use F11, F5, etc.
      if (/^F\d+$/.test(e.key)) return;
      e.preventDefault();
      if (phase !== "playing") { start(); return; }
      if (e.repeat) return;
      const n = "123".indexOf(e.key);
      if (e.key.length === 1 && n >= 0) choose(n);
      else mash();
    });

    // Tap a face button to pick it, or the big face to change its feeling.
    canvas.addEventListener("pointerdown", (e) => {
      if (phase !== "playing") { start(); return; }
      const slot = cardAt(e.clientX, e.clientY);
      if (slot >= 0) choose(slot);
      else if (Math.hypot(e.clientX - L.cx, e.clientY - L.cy) < L.r * 1.1) mash();
    });
    startScreen.addEventListener("pointerdown", start);
    doneScreen.addEventListener("pointerdown", start);

    soundBtn.addEventListener("click", () => {
      setSound(!soundOn);
      soundBtn.blur();
    });

    // Time's up: the big face gets happy, waves the buttons away and says goodbye.
    timer.onSecond = tick;
    timer.onEnd = () => {
      phase = "finale";
      finaleT = 0;
      state = "done";
      target = 0; // happy
      feelT = 0;
      yayT = 0;
      for (const c of cards) if (!c.fade) c.fade = 0.001;
      FEELING_SOUNDS.happy();
      sparkle(L.cx, L.cy, L.r * 0.6);
      say("I feel happy! Bye bye!");
    };

    setSound(soundOn);
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
