<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Duckling Parade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9fdcff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .corner {
      position: fixed;
      top: 12px;
      z-index: 3;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(58, 46, 92, 0.12);
      color: #3a2e5c;
      font-size: 24px;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
    }
    .corner:hover { background: rgba(58, 46, 92, 0.22); }
    #home { left: 12px; }
    #sound { right: 12px; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      text-align: center;
      color: #3a2e5c;
      font-family: Fredoka, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }
    .overlay h1 { margin: 0; font-size: clamp(3rem, 12vw, 8rem); color: #ffb627; text-shadow: 0 6px 0 #fff; }
    .overlay p { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); animation: pulse 1.2s ease-in-out infinite; }
    .overlay .score { animation: none; }
    .overlay .again { visibility: hidden; }
    .overlay.hidden { display: none; }
    #done { background: rgba(255, 255, 255, 0.6); }
    @keyframes pulse { 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <canvas id="park"></canvas>

  <a id="home" class="corner" href="../../index.html" tabindex="-1" title="Back to games">🏠</a>
  <button id="sound" class="corner" tabindex="-1" title="Sound on/off">🔊</button>

  <div id="start" class="overlay">
    <h1>Duckling Parade</h1>
    <p>Press any key to play! 🐤</p>
  </div>

  <div id="done" class="overlay hidden">
    <h1>All done! 🎉</h1>
    <p class="score" id="score"></p>
    <p class="again" id="again">Press any key to play again!</p>
  </div>

  <script src="../../shared/round-timer.js"></script>
  <script>
    const FONT = "Fredoka, 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif";
    const EMOJI_FONT = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
    const COLORS = ["#ff5d73", "#ffb627", "#2ec4b6", "#5b8def", "#b15ef0", "#7ae582", "#ff8fd8"];
    const WORDS = [
      "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
      "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen", "Twenty",
    ];
    const MAMA = "🦆";
    const CHICK = "🐤";
    const PARADE_SIZE = 20;   // ducklings before everyone heads to the pond
    const MARCH_DELAY = 1.4;  // pause after the last one so "Twenty!" can be heard
    const SWIM_TIME = 2.2;    // seconds a duck paddles before fading away
    const LETTER_LIFE = 2.2;  // seconds a typed letter peeks over the hill

    const canvas = document.getElementById("park");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("start");
    const soundBtn = document.getElementById("sound");
    const doneScreen = document.getElementById("done");
    const scoreText = document.getElementById("score");
    const againText = document.getElementById("again");
    const ROUND_SECONDS = 120;
    const timer = new RoundTimer(ROUND_SECONDS);

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOutBack = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;

    let W = 0, H = 0, sky = null, flowers = [], clouds = [];
    let L = {}; // layout: sizes, ground line, pond, where mama stands
    let ducks = [], particles = [], letters = [];
    let ghost = null; // see-through duckling waiting in the next spot
    let count = 0, parade = "lining", paradeT = 0; // lining -> waiting -> marching
    let phase = "title"; // title -> playing -> finale (time's up) -> done
    let time = 0, score = 0, restartAt = 0, lastQuack = 0;
    let soundOn = true;
    try { soundOn = localStorage.getItem("ducklingParadeSound") !== "off"; } catch {}

    // ---------- Layout ----------

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#9fdcff");
      sky.addColorStop(1, "#e6f7ff");

      const landscape = W >= H * 1.1;
      const mama = clamp(Math.min(W, H) * 0.16, 64, 160);
      const pondRx = clamp(W * 0.14, 50, 260);
      const ground = H * (landscape ? 0.66 : 0.56);
      const pond = { cx: 16 + pondRx * 0.9, cy: ground + pondRx * 0.15, rx: pondRx, ry: pondRx * 0.35 };
      const mamaX = pond.cx + pond.rx + mama * 0.5;
      // Ducklings line up behind mama, wrapping onto extra rows if the screen is narrow.
      // Shrink them until a full parade fits on the grass.
      let chick = mama * 0.6, gap, perRow;
      for (;;) {
        gap = chick * 1.05;
        perRow = Math.max(1, Math.floor((W - 16 - mamaX - mama * 0.35) / gap));
        const rows = Math.ceil(PARADE_SIZE / perRow);
        if (ground + (rows - 1) * chick * 1.4 + chick * 0.2 <= H - 8 || chick < 20) break;
        chick *= 0.92;
      }
      const horizon = ground - H * 0.16;
      const hill = { cx: W * 0.75, cy: horizon + H * 0.04, rx: W * 0.6, ry: H * 0.12 };
      L = { mama, chick, gap, ground, pond, mamaX, perRow, horizon, hill };

      flowers = Array.from({ length: Math.round(W / 25) }, () => ({
        x: rand(0, W), y: rand(L.horizon + H * 0.04, H), color: pick(["#fff", "#ffe066", "#ff9fd0"]),
      }));
      clouds = Array.from({ length: Math.max(2, Math.round(W / 400)) }, () => ({
        x: rand(0, W), y: rand(H * 0.14, L.horizon - H * 0.08), s: rand(0.5, 1), speed: rand(6, 14),
      }));
    }

    // Where duck number `slot` stands (-1 is mama).
    function slotPos(slot) {
      if (slot < 0) return { x: L.mamaX, y: L.ground - L.mama * 0.45 };
      const col = slot % L.perRow;
      const row = Math.floor(slot / L.perRow);
      return {
        x: L.mamaX + L.mama * 0.35 + L.gap * (col + 0.6),
        y: L.ground - L.chick * 0.45 + row * L.chick * 1.4,
      };
    }

    // Top edge of the hills at x (the flat meadow where the big hill doesn't reach).
    function hillTop(x) {
      const h = L.hill;
      const u = (x - h.cx) / h.rx;
      return Math.abs(u) < 1 ? h.cy - h.ry * Math.sqrt(1 - u * u) : h.cy;
    }

    // ---------- Sound ----------

    let actx = null, master = null, noise = null;

    function audio() {
      if (!soundOn) return null;
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.5;
        master.connect(actx.destination);
        noise = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }

    function tone(freq, start, dur, vol, type = "sine", endFreq = freq) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + start;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function quack() {
      const a = audio(); if (!a) return;
      lastQuack = time;
      for (const off of [0, 0.18]) {
        const t = a.currentTime + off;
        const osc = a.createOscillator();
        const filter = a.createBiquadFilter();
        const gain = a.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(380, t + 0.14);
        filter.type = "bandpass";
        filter.frequency.value = 1100;
        filter.Q.value = 3;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(filter).connect(gain).connect(master);
        osc.start(t);
        osc.stop(t + 0.17);
      }
    }

    function peep() {
      tone(1800, 0, 0.07, 0.12, "sine", 2400);
      tone(1900, 0.1, 0.07, 0.12, "sine", 2500);
    }

    function splashSound() {
      const a = audio(); if (!a) return;
      const t = a.currentTime;
      const src = a.createBufferSource();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      src.buffer = noise;
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(2500, t);
      filter.frequency.exponentialRampToValueAtTime(300, t + 0.35);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      src.connect(filter).connect(gain).connect(master);
      src.start(t, rand(0, 1.5));
      src.stop(t + 0.42);
      tone(500, 0, 0.15, 0.2, "sine", 150); // plop
    }

    function cheer() {
      [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.08, 0.3, 0.15, "triangle"));
    }

    function tick() {
      tone(1200, 0, 0.06, 0.1, "sine", 900);
    }

    function fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.12, i === 3 ? 0.8 : 0.3, 0.2, "triangle"));
    }

    function say(text) {
      if (!soundOn || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.8;
      u.pitch = 1.3;
      speechSynthesis.speak(u);
    }

    function setSound(on) {
      soundOn = on;
      soundBtn.textContent = on ? "🔊" : "🔇";
      try { localStorage.setItem("ducklingParadeSound", on ? "on" : "off"); } catch {}
      if (!on && "speechSynthesis" in window) speechSynthesis.cancel();
    }

    // ---------- Game ----------

    function newMama() {
      const p = slotPos(-1);
      ducks.push({ kind: "mama", slot: -1, x: p.x, y: p.y, state: "stand", t: 0, alpha: 1 });
    }

    function newParade() {
      count = 0;
      parade = "lining";
      newMama();
      spawnGhost();
    }

    // A see-through duckling waddles in to show where the next number will go.
    function spawnGhost() {
      ghost = count < PARADE_SIZE
        ? { kind: "ghost", slot: count, n: count + 1, x: W + L.chick, y: slotPos(count).y, state: "walkin", t: 0, alpha: 0.35 }
        : null;
    }

    function addDuckling() {
      if (parade !== "lining") {
        if (time - lastQuack > 0.4) quack();
        return;
      }
      const slot = count;
      count++;
      if (phase === "playing") score++;
      // The ghost (if it's made it on screen) turns into the real duckling right where it is.
      const x = ghost && ghost.slot === slot ? Math.min(ghost.x, W + L.chick) : W + L.chick;
      ducks.push({ kind: "chick", slot, n: count, x, y: slotPos(slot).y, state: "walkin", t: 0, alpha: 1 });
      peep();
      say(`${WORDS[count - 1]}!`);
      if (count === PARADE_SIZE) {
        parade = "waiting";
        paradeT = 0;
      }
      spawnGhost();
    }

    function popLetter(ch) {
      const size = clamp(H * 0.13, 48, 140);
      // Only as many as fit side by side; the oldest ducks back down early to make room.
      let up = letters.filter((l) => l.t < LETTER_LIFE);
      const room = Math.max(3, Math.floor((W * 0.84) / (size * 1.2)));
      for (const l of up.slice(0, Math.max(0, up.length + 1 - room))) l.t = LETTER_LIFE;
      up = up.filter((l) => l.t < LETTER_LIFE);
      // Try a few spots and keep the one furthest from letters still showing.
      let best = 0, bestGap = -1;
      for (let i = 0; i < 8; i++) {
        const x = rand(W * 0.08, W * 0.92);
        const gap = Math.min(Infinity, ...up.map((l) => Math.abs(l.x - x)));
        if (gap > bestGap) { best = x; bestGap = gap; }
      }
      letters.push({ ch, x: best, size, color: pick(COLORS), t: 0, tilt: rand(-0.15, 0.15) });
    }

    function startMarch() {
      parade = "marching";
      ghost = null;
      for (const d of ducks) {
        if (d.state === "swim") continue;
        d.state = "march";
        d.t = 0;
      }
      quack();
      say("Off to the pond!");
    }

    function splash(x, y, size) {
      splashSound();
      for (let i = 0; i < 16; i++) {
        const a = rand(-Math.PI * 0.95, -Math.PI * 0.05);
        const s = size * rand(2, 4);
        particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: rand(0.5, 0.8), age: 0, size: rand(3, 6), color: pick(["#ffffff", "#bfe9ff", "#7cc8f0"]),
        });
      }
    }

    function finishRound(message) {
      phase = "done";
      scoreText.textContent = message;
      againText.style.visibility = "hidden";
      doneScreen.classList.remove("hidden");
      restartAt = time + 2; // stop key-mashing from skipping straight past the end screen
      fanfare();
      say("All done!");
    }

    function update(dt) {
      timer.update(dt);

      for (const c of clouds) {
        c.x += c.speed * dt;
        if (c.x - 120 * c.s > W) c.x = -120 * c.s;
      }

      const P = L.pond;
      for (const d of ducks) {
        d.t += dt;
        const size = d.kind === "mama" ? L.mama : L.chick;
        if (d.state === "walkin") {
          const p = slotPos(d.slot);
          d.x += (p.x - d.x) * Math.min(1, dt * 5);
          d.y = p.y;
          if (Math.abs(p.x - d.x) < 2) d.state = "stand";
        } else if (d.state === "stand") {
          const p = slotPos(d.slot);
          d.x = p.x;
          d.y = p.y;
        } else if (d.state === "march") {
          d.x -= Math.max(160, W * 0.3) * dt;
          if (d.x < P.cx + P.rx * 0.75) {
            d.state = "swim";
            d.t = 0;
            d.swimX = rand(P.cx - P.rx * 0.6, P.cx + P.rx * 0.5);
            d.swimY = P.cy + rand(-0.3, 0.2) * P.ry - size * 0.2;
            splash(d.x, P.cy, size);
          }
        } else if (d.state === "swim") {
          d.x += (d.swimX - d.x) * Math.min(1, dt * 2);
          d.y += (d.swimY - d.y) * Math.min(1, dt * 4);
          d.alpha = 1 - clamp((d.t - SWIM_TIME + 0.8) / 0.8, 0, 1);
        }
      }
      ducks = ducks.filter((d) => d.alpha > 0);

      if (ghost) {
        ghost.t += dt;
        const p = slotPos(ghost.slot);
        ghost.y = p.y;
        ghost.x = Math.max(p.x, ghost.x - Math.max(110, W * 0.18) * dt);
        ghost.state = ghost.x > p.x ? "walkin" : "stand";
        ghost.alpha = 0.32 + Math.sin(time * 4) * 0.08;
      }

      for (const l of letters) l.t += dt;
      letters = letters.filter((l) => l.t < LETTER_LIFE + 0.5);

      paradeT += dt;
      if (parade === "waiting" && paradeT > MARCH_DELAY) startMarch();
      if (parade === "marching" && !ducks.length) {
        if (phase === "playing") {
          newParade();
          cheer();
          say(`${PARADE_SIZE} ducklings! Splash!`);
        } else if (phase === "finale") {
          finishRound(`You counted ${score} duckling${score === 1 ? "" : "s"}!`);
        }
      }
      if (phase === "done" && time >= restartAt) againText.style.visibility = "visible";

      for (const p of particles) {
        p.age += dt;
        p.vy += 500 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      particles = particles.filter((p) => p.age < p.life);
    }

    // ---------- Drawing ----------

    function drawScene() {
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#ffd84d";
      ctx.beginPath();
      ctx.arc(W - 100, Math.min(130, L.horizon * 0.45), 42, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.9)";
      for (const c of clouds) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.s, c.s);
        ctx.beginPath();
        ctx.arc(-50, 10, 35, 0, Math.PI * 2);
        ctx.arc(0, -10, 50, 0, Math.PI * 2);
        ctx.arc(55, 10, 38, 0, Math.PI * 2);
        ctx.arc(0, 20, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Typed letters sit behind the hills so they can pop up over them.
      for (const l of letters) drawLetter(l);

      const h = L.hill;
      ctx.fillStyle = "#9bd88a";
      ctx.beginPath();
      ctx.ellipse(h.cx, h.cy, h.rx, h.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6cbf5c";
      ctx.fillRect(0, h.cy, W, H);
      for (const f of flowers) {
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Pond with a sandy rim, a shine, and some reeds.
      const P = L.pond;
      ctx.fillStyle = "#d8c48a";
      ctx.beginPath();
      ctx.ellipse(P.cx, P.cy, P.rx * 1.06, P.ry * 1.15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#4aa8e0";
      ctx.beginPath();
      ctx.ellipse(P.cx, P.cy, P.rx, P.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.ellipse(P.cx - P.rx * 0.2, P.cy - P.ry * 0.3, P.rx * 0.45, P.ry * 0.3, 0, Math.PI * 1.1, Math.PI * 1.6);
      ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const x = P.cx - P.rx * 0.9 + i * 10;
        const top = P.cy - P.ry - 30 - (i % 2) * 14;
        ctx.strokeStyle = "#4e8f3a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, P.cy - P.ry * 0.4);
        ctx.lineTo(x + 3, top);
        ctx.stroke();
        ctx.fillStyle = "#7a4a26";
        ctx.beginPath();
        ctx.ellipse(x + 3, top + 8, 4, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // A letter springs up from behind the hill, bobs for a bit, then sinks back down.
    function drawLetter(l) {
      const top = hillTop(l.x);
      const hidden = top + l.size * 0.85;
      const shown = top - l.size * 0.12;
      const up = easeOutBack(Math.min(1, l.t / 0.45));
      const down = clamp((l.t - LETTER_LIFE) / 0.5, 0, 1);
      const y = hidden + (shown - hidden) * up * (1 - down * down) + Math.sin(l.t * 3) * l.size * 0.03;
      ctx.save();
      ctx.globalAlpha = 1 - down;
      ctx.translate(l.x, y);
      ctx.rotate(l.tilt + Math.sin(l.t * 2.5) * 0.06);
      ctx.font = `600 ${l.size}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.lineJoin = "round";
      ctx.lineWidth = l.size * 0.16;
      ctx.strokeStyle = "#fff";
      ctx.strokeText(l.ch, 0, 0);
      ctx.fillStyle = l.color;
      ctx.fillText(l.ch, 0, 0);
      ctx.restore();
    }

    function drawDuck(d) {
      const size = d.kind === "mama" ? L.mama : L.chick;
      const phaseOff = d.slot * 0.7;
      let rot = Math.sin(time * 3 + phaseOff) * 0.04;
      let hop = 0;
      let scale = 1;
      if (d.state === "walkin" || d.state === "march") {
        rot = Math.sin(time * 14 + phaseOff) * 0.15;
        hop = Math.abs(Math.sin(time * 14 + phaseOff)) * size * 0.08;
      }
      if (d.kind === "mama" && d.state === "stand") scale = easeOutBack(Math.min(1, d.t / 0.4));

      ctx.save();
      ctx.globalAlpha = d.alpha;
      if (d.state === "swim") {
        ctx.strokeStyle = "rgba(255,255,255,0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(d.x, d.y + size * 0.38, size * 0.45, size * 0.1, 0, 0, Math.PI * 2);
        ctx.stroke();
        hop = Math.sin(time * 3 + phaseOff) * size * 0.04;
      }
      ctx.translate(d.x, d.y - hop);
      ctx.rotate(rot);
      ctx.scale(scale, scale);
      ctx.font = `${size}px ${EMOJI_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#000"; // emoji pick up the fill's alpha, so make sure it's opaque
      // Wash the ghost out towards white so it reads as a ghost, not just a faint duck.
      if (d.kind === "ghost") ctx.filter = "grayscale(0.6) brightness(1.5)";
      ctx.fillText(d.kind === "mama" ? MAMA : CHICK, 0, 0);
      ctx.restore();
    }

    // Each duckling wears its number; the newest one pops in big.
    function drawNumber(d) {
      if (d.kind === "mama" || d.state === "swim") return;
      if (d.kind === "ghost") {
        // The next number, faint and bobbing, waiting to be typed.
        const size = L.chick * 0.5;
        ctx.save();
        ctx.globalAlpha = d.alpha + 0.15;
        ctx.font = `600 ${size}px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#fff";
        ctx.fillText(d.n, d.x, d.y - L.chick * 0.65 + Math.sin(time * 4) * 3);
        ctx.restore();
        return;
      }
      const newest = d.n === count && parade === "lining";
      const size = L.chick * 0.55 * (newest ? 1.5 : 1) * easeOutBack(Math.min(1, d.t / 0.4));
      if (size <= 0) return;
      const y = d.y - L.chick * 0.65 - (newest ? L.chick * 0.2 : 0);
      ctx.font = `600 ${size}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 0.22;
      ctx.strokeStyle = "#fff";
      ctx.strokeText(d.n, d.x, y);
      ctx.fillStyle = COLORS[(d.n - 1) % COLORS.length];
      ctx.fillText(d.n, d.x, y);
    }

    function draw() {
      drawScene();
      // Back rows first so nearer ducklings overlap the ones behind.
      const sorted = [...ducks, ...(ghost ? [ghost] : [])].sort((a, b) => a.y - b.y);
      for (const d of sorted) drawDuck(d);
      for (const d of sorted) drawNumber(d);

      for (const p of particles) {
        ctx.globalAlpha = 1 - p.age / p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (phase !== "title") timer.draw(ctx, W, H);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---------- Input ----------

    function start() {
      if (phase === "playing" || phase === "finale") return;
      if (phase === "done" && time < restartAt) return;
      phase = "playing";
      score = 0;
      startScreen.classList.add("hidden");
      doneScreen.classList.add("hidden");
      audio();
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
      ducks = [];
      letters = [];
      newParade();
      quack();
      timer.start();
    }

    addEventListener("keydown", (e) => {
      // Leave F1–F12 alone so grown-ups can still use F11, F5, etc.
      if (/^F\d+$/.test(e.key)) return;
      e.preventDefault();
      if (phase !== "playing") { start(); return; }
      if (e.repeat) return;
      if (/^[a-z0-9]$/i.test(e.key)) popLetter(e.key.toUpperCase());
      addDuckling();
    });

    canvas.addEventListener("pointerdown", () => {
      if (phase !== "playing") { start(); return; }
      addDuckling();
    });
    startScreen.addEventListener("pointerdown", start);
    doneScreen.addEventListener("pointerdown", start);

    soundBtn.addEventListener("click", () => {
      setSound(!soundOn);
      soundBtn.blur();
    });

    // Time's up: everyone still on the grass waddles off for a swim.
    timer.onSecond = tick;
    timer.onEnd = () => {
      phase = "finale";
      if (parade !== "marching") startMarch();
    };

    setSound(soundOn);
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
