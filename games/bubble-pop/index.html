<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Bubble Pop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0d4f73;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .corner {
      position: fixed;
      top: 12px;
      z-index: 3;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 24px;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
    }
    .corner:hover { background: rgba(255, 255, 255, 0.28); }
    #home { left: 12px; }
    #sound { right: 12px; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      text-align: center;
      color: #fff;
      font-family: Fredoka, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
      background: rgba(6, 40, 64, 0.45);
      cursor: pointer;
    }
    .overlay h1 { margin: 0; font-size: clamp(3rem, 12vw, 8rem); text-shadow: 0 0 30px #5ee6ff; }
    .overlay p { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); animation: pulse 1.2s ease-in-out infinite; }
    .overlay .score { animation: none; }
    .overlay .again { visibility: hidden; }
    .overlay.hidden { display: none; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <canvas id="sea"></canvas>

  <a id="home" class="corner" href="../../index.html" tabindex="-1" title="Back to games">🏠</a>
  <button id="sound" class="corner" tabindex="-1" title="Sound on/off">🔊</button>

  <div id="start" class="overlay">
    <h1>Bubble Pop</h1>
    <p>Press any key to play! 🫧</p>
  </div>

  <div id="done" class="overlay hidden">
    <h1>All done! 🎉</h1>
    <p class="score" id="score"></p>
    <p class="again" id="again">Press any key to play again!</p>
  </div>

  <script src="../../shared/round-timer.js"></script>
  <script>
    const FONT = "Fredoka, 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif";
    const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const COLORS = ["#ff5d73", "#ffb627", "#2ec4b6", "#5b8def", "#b15ef0", "#7ae582", "#ff8fd8"];
    // C major pentatonic: every pop lands on a happy note.
    const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    const MAX_BUBBLES = 8;
    const SPAWN_INTERVAL = 1.4;      // seconds between new bubbles
    const SPAWN_INTERVAL_FEW = 0.8;  // ...and when the screen is nearly empty

    const canvas = document.getElementById("sea");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("start");
    const soundBtn = document.getElementById("sound");
    const doneScreen = document.getElementById("done");
    const scoreText = document.getElementById("score");
    const againText = document.getElementById("again");
    const ROUND_SECONDS = 120;
    const timer = new RoundTimer(ROUND_SECONDS);

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    let W = 0, H = 0, sea = null, specks = [];
    let bubbles = [], drops = [], rings = [];
    let phase = "title"; // title -> playing -> finale (time's up) -> done
    let time = 0, spawnIn = 0, score = 0, restartAt = 0, finaleIn = 0;
    let soundOn = true;
    try { soundOn = localStorage.getItem("bubblePopSound") !== "off"; } catch {}

    // ---------- Layout ----------

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sea = ctx.createLinearGradient(0, 0, 0, H);
      sea.addColorStop(0, "#2bb3d9");
      sea.addColorStop(1, "#0a3a5c");
      // Tiny background bubbles that just drift up for atmosphere.
      specks = Array.from({ length: Math.round((W * H) / 14000) }, () => ({
        x: rand(0, W), y: rand(0, H), r: rand(1.5, 4), speed: rand(15, 40), phase: rand(0, Math.PI * 2),
      }));
    }

    function baseRadius() {
      return clamp(Math.min(W, H) * 0.09, 45, 90);
    }

    // ---------- Sound ----------

    let actx = null, master = null;

    function audio() {
      if (!soundOn) return null;
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.5;
        master.connect(actx.destination);
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }

    function tone(freq, start, dur, vol, type = "sine", endFreq = freq) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + start;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function popSound() {
      const f = pick(SCALE);
      tone(f * 0.5, 0, 0.09, 0.35, "sine", f * 1.5); // bloop
      tone(f, 0.04, 0.35, 0.12, "triangle");         // sparkle
    }

    let lastBoop = 0;
    function boop() {
      if (time - lastBoop < 0.08) return;
      lastBoop = time;
      tone(260, 0, 0.15, 0.15, "sine", 180);
    }

    function tick() {
      tone(1200, 0, 0.06, 0.1, "sine", 900);
    }

    function fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.12, i === 3 ? 0.8 : 0.3, 0.2, "triangle"));
    }

    function say(text) {
      if (!soundOn || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.8;
      u.pitch = 1.3;
      speechSynthesis.speak(u);
    }

    function setSound(on) {
      soundOn = on;
      soundBtn.textContent = on ? "🔊" : "🔇";
      try { localStorage.setItem("bubblePopSound", on ? "on" : "off"); } catch {}
      if (!on && "speechSynthesis" in window) speechSynthesis.cancel();
    }

    // ---------- Game ----------

    function spawnBubble(y = H + baseRadius() * 1.2) {
      // Keep characters on screen unique so each key press means one bubble.
      const onScreen = new Set(bubbles.map((b) => b.char));
      const free = [...CHARS].filter((c) => !onScreen.has(c));
      const r = baseRadius() * rand(0.8, 1.15);

      // Try a few x positions and keep the one furthest from bubbles near the bottom.
      let x = W / 2, bestDist = -1;
      for (let i = 0; i < 8; i++) {
        const cx = W > 2 * r ? rand(r, W - r) : W / 2;
        const dist = Math.min(Infinity, ...bubbles.map((b) => Math.hypot(b.x - cx, b.y - y)));
        if (dist > bestDist) { x = cx; bestDist = dist; }
      }

      bubbles.push({
        char: pick(free), color: pick(COLORS), r,
        x0: x, x, y,
        speed: rand(35, 60),
        swayAmp: rand(10, 30), swayFreq: rand(0.6, 1.2), phase: rand(0, Math.PI * 2),
        age: 0,
      });
    }

    function pop(b, quiet = false) {
      if (phase === "playing") score++;
      bubbles.splice(bubbles.indexOf(b), 1);
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + rand(-0.1, 0.1);
        const s = b.r * rand(3, 5);
        drops.push({
          x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          size: rand(3, 6), life: rand(0.4, 0.7), age: 0, color: b.color,
        });
      }
      rings.push({ x: b.x, y: b.y, r: b.r, age: 0, life: 0.35, color: b.color });
      popSound();
      if (!quiet) say(b.char);
    }

    function finishRound(message) {
      phase = "done";
      scoreText.textContent = message;
      againText.style.visibility = "hidden";
      doneScreen.classList.remove("hidden");
      restartAt = time + 2; // stop key-mashing from skipping straight past the end screen
      fanfare();
      say("All done!");
    }

    function update(dt) {
      timer.update(dt);
      if (phase === "playing") {
        spawnIn -= dt;
        if (spawnIn <= 0 && bubbles.length < MAX_BUBBLES) {
          spawnBubble();
          spawnIn = bubbles.length < 3 ? SPAWN_INTERVAL_FEW : SPAWN_INTERVAL;
        }
      }

      // Time's up: pop whatever is left on screen, top to bottom, then celebrate.
      if (phase === "finale") {
        finaleIn -= dt;
        if (finaleIn <= 0) {
          const next = bubbles.filter((b) => b.y - b.r < H).sort((a, b) => a.y - b.y)[0];
          if (next) {
            pop(next, true);
            finaleIn = 0.15;
          } else {
            bubbles = [];
            finishRound(`You popped ${score} bubble${score === 1 ? "" : "s"}!`);
          }
        }
      }
      if (phase === "done" && time >= restartAt) againText.style.visibility = "visible";

      for (const s of specks) {
        s.y -= s.speed * dt;
        if (s.y < -10) { s.y = H + 10; s.x = rand(0, W); }
      }

      for (const b of bubbles) {
        b.age += dt;
        b.y -= b.speed * dt;
        b.x = b.x0 + Math.sin(b.age * b.swayFreq + b.phase) * b.swayAmp;
      }
      // Bubbles that float off the top just drift away.
      bubbles = bubbles.filter((b) => b.y + b.r > -10);

      for (const d of drops) {
        d.age += dt;
        d.vx *= Math.max(0, 1 - 5 * dt);
        d.vy = d.vy * Math.max(0, 1 - 5 * dt) + 150 * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
      }
      drops = drops.filter((d) => d.age < d.life);

      for (const r of rings) r.age += dt;
      rings = rings.filter((r) => r.age < r.life);
    }

    // ---------- Drawing ----------

    function drawBubble(b) {
      const wobble = 1 + 0.04 * Math.sin(b.age * 5 + b.phase);
      const grow = Math.min(1, b.age / 0.3);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(wobble * grow, (2 - wobble) * grow);

      // See-through body: clear in the middle, tinted towards the rim.
      const body = ctx.createRadialGradient(0, 0, b.r * 0.2, 0, 0, b.r);
      body.addColorStop(0, "rgba(255,255,255,0.05)");
      body.addColorStop(0.75, "rgba(255,255,255,0.12)");
      body.addColorStop(1, b.color + "99");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.stroke();

      // Shine
      ctx.lineCap = "round";
      ctx.lineWidth = b.r * 0.12;
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.72, Math.PI * 1.1, Math.PI * 1.4);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.arc(-b.r * 0.2, -b.r * 0.62, b.r * 0.06, 0, Math.PI * 2);
      ctx.fill();

      // Letter
      const size = b.r * 1.1;
      ctx.font = `600 ${size}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const m = ctx.measureText(b.char);
      const dy = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 0.12;
      ctx.strokeStyle = "#fff";
      ctx.strokeText(b.char, 0, dy);
      ctx.fillStyle = b.color;
      ctx.fillText(b.char, 0, dy);
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = sea;
      ctx.fillRect(0, 0, W, H);

      // Soft light rays from the surface
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 4; i++) {
        const x = W * (0.15 + i * 0.25) + Math.sin(time * 0.3 + i) * 40;
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        ctx.beginPath();
        ctx.moveTo(x - 40, 0);
        ctx.lineTo(x + 40, 0);
        ctx.lineTo(x + 160, H);
        ctx.lineTo(x - 20, H);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1.5;
      for (const s of specks) {
        ctx.beginPath();
        ctx.arc(s.x + Math.sin(time * 2 + s.phase) * 4, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (const b of bubbles) drawBubble(b);

      for (const r of rings) {
        const k = r.age / r.life;
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r * (1 + k * 0.6), 0, Math.PI * 2);
        ctx.stroke();
      }
      for (const d of drops) {
        ctx.globalAlpha = 1 - d.age / d.life;
        ctx.fillStyle = Math.random() < 0.5 ? "#fff" : d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (phase !== "title") timer.draw(ctx, W, H);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ---------- Input ----------

    function start() {
      if (phase === "playing" || phase === "finale") return;
      if (phase === "done" && time < restartAt) return;
      phase = "playing";
      score = 0;
      startScreen.classList.add("hidden");
      doneScreen.classList.add("hidden");
      audio();
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
      bubbles = [];
      // Start with a few bubbles already on their way up so there's something to pop right away.
      for (const k of [0.35, 0.6, 0.85]) spawnBubble(H * k);
      spawnIn = SPAWN_INTERVAL;
      timer.start();
    }

    addEventListener("keydown", (e) => {
      // Leave F1–F12 alone so grown-ups can still use F11, F5, etc.
      if (/^F\d+$/.test(e.key)) return;
      e.preventDefault();
      if (phase !== "playing") { start(); return; }
      if (e.repeat || e.key.length !== 1) return;
      const key = e.key.toUpperCase();
      const match = bubbles.find((b) => b.char === key && b.y - b.r < H);
      if (match) pop(match);
      else boop();
    });

    // Tap a bubble to pop it. Check the newest (front-most) bubbles first.
    canvas.addEventListener("pointerdown", (e) => {
      if (phase !== "playing") { start(); return; }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r * 1.1) { pop(b); return; }
      }
    });
    startScreen.addEventListener("pointerdown", start);
    doneScreen.addEventListener("pointerdown", start);

    soundBtn.addEventListener("click", () => {
      setSound(!soundOn);
      soundBtn.blur();
    });

    timer.onSecond = tick;
    timer.onEnd = () => {
      phase = "finale";
      finaleIn = 0.4;
    };

    setSound(soundOn);
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
