<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the Fun</title>
  <style>
    :root {
      --bg: #fff8e7;
      --ink: #3a2e5c;
      --card-shadow: rgba(58, 46, 92, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 32px;
      letter-spacing: 2px;
    }
    h1 span:nth-child(5n+1) { color: #ff5d73; }
    h1 span:nth-child(5n+2) { color: #ffb627; }
    h1 span:nth-child(5n+3) { color: #2ec4b6; }
    h1 span:nth-child(5n+4) { color: #5b8def; }
    h1 span:nth-child(5n+5) { color: #b15ef0; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 960px;
    }
    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px;
      text-align: center;
      aspect-ratio: 1;
      border-radius: 32px;
      text-decoration: none;
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 10px 0 var(--card-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .game:hover, .game:focus-visible {
      transform: translateY(-6px) rotate(-2deg);
      box-shadow: 0 16px 0 var(--card-shadow);
      outline: none;
    }
    .game:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--card-shadow); }
    .game .icon { font-size: 5rem; line-height: 1; }
    .game.soon { background: #d9d4e8; color: #8a83a3; pointer-events: none; }
  </style>
</head>
<body>
  <h1 aria-label="Join the Fun">
    <span>J</span><span>o</span><span>i</span><span>n</span> <span>t</span><span>h</span><span>e</span> <span>F</span><span>u</span><span>n</span>
  </h1>

  <main class="games">
    <a class="game" href="games/letter-pop/index.html" style="background:#ff5d73">
      <span class="icon">🎆</span>
      Letter Pop
    </a>
    <a class="game" href="games/key-party/index.html" style="background:#ffb627">
      <span class="icon">🎉</span>
      Key Party
    </a>
    <a class="game" href="games/bubble-pop/index.html" style="background:#2ec4b6">
      <span class="icon">🫧</span>
      Bubble Pop
    </a>
    <a class="game" href="games/peekaboo-farm/index.html" style="background:#5b8def">
      <span class="icon">🐮</span>
      Peekaboo Farm
    </a>
    <a class="game" href="games/colour-splash/index.html" style="background:#b15ef0">
      <span class="icon">🎨</span>
      Colour Splash
    </a>
    <div class="game soon" aria-hidden="true">
      <span class="icon">❓</span>
      Coming soon
    </div>
  </main>
</body>
</html>
